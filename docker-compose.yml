version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillswap}
      POSTGRES_DB: ${POSTGRES_DB:-skillswap_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-skillswap}']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillswap}:${POSTGRES_PASSWORD:-skillswap}@db:5432/${POSTGRES_DB:-skillswap_dev}
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: development
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - server

volumes:
  postgres_data:
