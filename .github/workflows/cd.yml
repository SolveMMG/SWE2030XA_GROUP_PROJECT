name: CD

on:
  push:
    branches: [main]

# Requires branch protection: CI must pass before this runs.
# Add RENDER_DEPLOY_HOOK_SERVER and RENDER_DEPLOY_HOOK_CLIENT
# to repo Settings → Secrets and variables → Actions.

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger server deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}"

      - name: Trigger client deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}"
