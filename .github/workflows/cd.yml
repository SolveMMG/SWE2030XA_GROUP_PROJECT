name: CD

on:
  push:
    branches: [main]



jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger server deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}"

      - name: Trigger client deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}"
